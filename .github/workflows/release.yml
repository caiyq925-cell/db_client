name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (MSVC)
        run: rustup default stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & bundle (Tauri)
        run: npx tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/ -ErrorAction SilentlyContinue
          Get-ChildItem out

      - name: Build portable (green) zip
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $src = 'src-tauri/target/release'
          $stage = 'out/portable'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$src/dbclient.exe" $stage
          # WebView2Loader.dll may be absent when MSVC + embedBootstrapper is used
          if (Test-Path "$src/WebView2Loader.dll") { Copy-Item "$src/WebView2Loader.dll" $stage }
          Compress-Archive -Path "$stage/*" -DestinationPath "out/dbclient_${ver}_portable_win-x64.zip"
          Get-ChildItem out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
          generate_release_notes: true
